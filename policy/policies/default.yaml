version: "0.2.0"
default_decision: deny

roles:
  owner:
    trust_min: 1.0
    permissions: ["*"]
  system:
    trust_min: 0.8
    permissions:
      - "audit:read"
      - "audit:write"
      - "policy:read"
      - "memory:read"
  agent_high:
    trust_min: 0.7
    permissions:
      - "tool:python"
      - "tool:file_read"
      - "memory:read"
      - "memory:write"
      - "memory:graph_traverse"
      - "memory:trail_reinforce"
      - "memory:swarm_query"
  agent_mid:
    trust_min: 0.5
    permissions:
      - "tool:file_read"
      - "memory:read"
      - "memory:graph_traverse"
  agent_low:
    trust_min: 0.0
    permissions:
      - "memory:read"

limits:
  tool_calls_per_minute: 60
  memory_ops_per_minute: 300
  graph_traversals_per_minute: 60
  swarm_queries_per_minute: 30
  spawn_requires_owner: true

memory_limits:
  max_nodes: 100
  max_edges: 500
  max_trails: 1000
  max_events: 10000
